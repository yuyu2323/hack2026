[project]
name = "storeloop-vercel"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2", "argon2-cffi>=25,<26", "fastapi>=0.115,<1",
  "httpx==0.28.1", "jsonschema>=4.23,<5", "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4", "pydantic>=2.10,<3", "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20", "SQLAlchemy>=2.0.40,<3", "uvicorn>=0.34,<1"
]

[tool.vercel]
entrypoint = "index:app"
