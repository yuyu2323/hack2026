name: storeloop-concept-02
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://storeloop:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/storeloop
  MEDIA_ROOT: /app/.local/media
  AI_SERVICE_URL: http://ai:8202
  AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN}
  ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
  SESSION_COOKIE_NAME: storeloop_concept_02_session
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: storeloop
      POSTGRES_USER: storeloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U storeloop -d storeloop]
      interval: 5s
      timeout: 3s
      retries: 20
  init:
    image: storeloop-concept-02-backend
    pull_policy: never
    command: [python, deploy/container_init.py]
    environment:
      <<: *backend-env
      SEED_DEMO: ${SEED_DEMO:-true}
    volumes: [application:/app/.local]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  api:
    image: storeloop-concept-02-backend
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment: *backend-env
    volumes: [application:/app/.local]
    depends_on:
      init: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
  ai:
    build:
      context: ..
      dockerfile: deploy/ai.Dockerfile
    environment:
      AI_PROVIDER: openai
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-6000}
      AI_REQUESTS_ENABLED: ${AI_REQUESTS_ENABLED:-false}
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8202/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
  worker:
    image: storeloop-concept-02-backend
    pull_policy: never
    command: [python, -m, server.analysis_jobs.worker]
    environment: *backend-env
    volumes: [application:/app/.local]
    depends_on:
      api: {condition: service_healthy}
      ai: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 150s
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8082}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  database:
  application:
  caddy_data:
  caddy_config:
